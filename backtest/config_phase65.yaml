# Phase 6.5 — bidirectional LONG/SHORT adaptive MoE
initial_capital: 100000
lookback_days: 1500
training_lookback_sessions: 1000
min_train_days: 120
min_positive_labels: 20
liquidity_lookback_sessions: 60
min_avg_turnover_cr: 5
portfolio_sizes: [1, 3, 5]
target_levels: [0.025, 0.03, 0.04, 0.05]
stop_loss_pct: 0.0125
max_per_expert: 10
max_candidates_per_day: 5
seed: 42
backtest_start: null
backtest_end: null
objective_daily_net_pct: 0.025
objective_monthly_pct: 0.30
# No predictive eligibility gate. LONG, SHORT and NO TRADE compete.
include_cpr_camarilla: true
allow_short: true
contrarian_enabled: true
contrarian_max_factor: 0.60
costs:
  brokerage_per_order: 20.0
  exchange_turnover_rate: 0.0000345
  stt_sell_rate: 0.00025
  sebi_turnover_rate: 0.000001
  stamp_buy_rate: 0.00003
  gst_rate: 0.18
  slippage_per_side: 0.0005
event_inputs:
  news_path: data/events/news.csv
  corporate_actions_path: data/events/corporate_actions.csv
