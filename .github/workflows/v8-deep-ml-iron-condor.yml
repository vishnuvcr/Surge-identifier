name: V8.2 Joint Range Deep ML Iron Condor Research

on:
  workflow_dispatch:
  push:
    branches:
      - v8.2-joint-range-ic
    paths:
      - 'v8/**'
      - 'v6.2/**'
      - '.github/workflows/v8-deep-ml-iron-condor.yml'
      - 'scripts/**'
      - 'requirements.txt'

concurrency:
  group: v8.2-joint-range-ic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      NSE_HISTORY_START: '2015-01-01'
      NSE_HISTORY_END: '2026-09-16'
      NSE_HISTORY_WORKERS: '5'
      V62_PRICE_WORKERS: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v8.2-joint-range-ic
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply V8.2 joint range patch
        run: python scripts/patch_v82_engine.py
      - name: Enforce V8.2 runtime summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v8/deep_iron_condor_engine.py')
          s=p.read_text()
          s=s.replace("'version':'V8.1'", "'version':'V8.2'")
          s=s.replace("'post_cost_ic_payoff':True,'six_window_wfo'", "'post_cost_ic_payoff':True,'joint_quantile_coherence':True,'baseline_audit':True,'six_window_wfo'")
          p.write_text(s)
          i=Path('v8/inspector.py')
          i.write_text(i.read_text().replace('V8.1','V8.2'))
          print('V8.2 runtime summary normalization applied')
          PY
      - name: Inspect V8.2
        run: python v8/inspector.py
      - name: Compile V8.2
        run: python -m py_compile v8/inspector.py v8/deep_iron_condor_engine.py scripts/patch_v82_engine.py
      - name: Download NIFTY options and futures history
        run: python scripts/download_nifty_nse_history.py
      - name: Download market context
        run: python scripts/download_v5_market_context.py
      - name: Download legacy flow context
        run: python scripts/download_v5_flow_context.py
      - name: Download Kaggle FII DII historical dataset
        run: python v6.2/download_fii_dii_kaggle.py
      - name: Download historical news
        run: python v6.2/download_news_robust.py
      - name: Download multimodal constituent and index data
        run: python v6.2/download_multimodal_data.py
      - name: Re-apply Kaggle FII DII dataset
        run: python v6.2/download_fii_dii_kaggle.py
      - name: Validate raw inputs
        run: |
          set -e
          for f in data/cache/nifty_options_long.parquet data/cache/nifty_futures_long.parquet data/cache/v5_market_context.parquet data/cache/v5_news_daily.csv data/cache/v62_nifty50_index.parquet data/cache/v62_constituent_prices.parquet data/cache/v62_constituent_weights.csv data/cache/v62_nifty50_membership.csv data/cache/v62_fii_dii.parquet; do test -s "$f" || { echo "missing $f"; exit 1; }; done
      - name: Run V8.2 research
        run: python v8/deep_iron_condor_engine.py
      - name: Validate V8.2 objectives and outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('v8/research')
          s=json.load(open(root/'summary.json'))
          assert s['version']=='V8.2'
          assert s['wfo_windows_completed'] == 6
          assert s['objectives']['coherent_range']
          assert s['objectives']['joint_quantile_coherence']
          assert s['objectives']['baseline_audit']
          assert s['objectives']['pop_from_expiry_payoff_distribution']
          assert s['objectives']['touch_probability_from_path_distribution']
          assert s['objectives']['post_cost_ic_payoff']
          assert s['objectives']['70_30']
          assert s['objectives']['new_oos']
          for f in ['wfo_metrics.csv','split_70_30_metrics.csv','new_oos_metrics.csv','latest_distribution.json','latest_iron_condor.json','status.json']:
              assert (root/f).exists(), f
          print(json.dumps(s,indent=2))
          PY
      - name: Commit V8.2 research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v8/research v8/deep_iron_condor_engine.py v8/inspector.py
          git diff --cached --quiet || git commit -m 'Publish V8.2 joint range iron condor research [skip ci]'
          git pull --rebase origin v8.2-joint-range-ic
          git push origin v8.2-joint-range-ic
