name: V8.1 Deep ML Iron Condor Research

on:
  workflow_dispatch:
  push:
    branches:
      - v8.1-coherent-ic-wfo
    paths:
      - 'v8/**'
      - 'v6.2/**'
      - '.github/workflows/v8-deep-ml-iron-condor.yml'
      - 'scripts/**'
      - 'requirements.txt'

concurrency:
  group: v8.1-coherent-ic-wfo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      NSE_HISTORY_START: '2015-01-01'
      NSE_HISTORY_END: '2026-09-16'
      NSE_HISTORY_WORKERS: '5'
      V62_PRICE_WORKERS: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v8.1-coherent-ic-wfo
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect V8.1
        run: python v8/inspector.py
      - name: Compile V8.1
        run: python -m py_compile v8/inspector.py v8/deep_iron_condor_engine.py
      - name: Download NIFTY options and futures history
        run: python scripts/download_nifty_nse_history.py
      - name: Download market context
        run: python scripts/download_v5_market_context.py
      - name: Download legacy flow context
        run: python scripts/download_v5_flow_context.py
      - name: Download Kaggle FII DII historical dataset
        run: python v6.2/download_fii_dii_kaggle.py
      - name: Download historical news
        run: python v6.2/download_news_robust.py
      - name: Download multimodal constituent and index data
        run: python v6.2/download_multimodal_data.py
      - name: Re-apply Kaggle FII DII dataset
        run: python v6.2/download_fii_dii_kaggle.py
      - name: Validate raw inputs
        run: |
          set -e
          for f in data/cache/nifty_options_long.parquet data/cache/nifty_futures_long.parquet data/cache/v5_market_context.parquet data/cache/v5_news_daily.csv data/cache/v62_nifty50_index.parquet data/cache/v62_constituent_prices.parquet data/cache/v62_constituent_weights.csv data/cache/v62_nifty50_membership.csv data/cache/v62_fii_dii.parquet; do test -s "$f" || { echo "missing $f"; exit 1; }; done
      - name: Run V8.1 research
        run: python v8/deep_iron_condor_engine.py
      - name: Validate V8.1 objectives and outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('v8/research')
          s=json.load(open(root/'summary.json'))
          assert s['version']=='V8.1'
          assert s['wfo_windows_completed'] == s['wfo_windows_required']
          assert s['objectives']['coherent_range']
          assert s['objectives']['pop_from_expiry_payoff_distribution']
          assert s['objectives']['touch_probability_from_path_distribution']
          assert s['objectives']['post_cost_ic_payoff']
          assert s['objectives']['70_30']
          assert s['objectives']['new_oos']
          assert (root/'wfo_metrics.csv').exists()
          assert (root/'split_70_30_metrics.csv').exists()
          assert (root/'new_oos_metrics.csv').exists()
          assert (root/'latest_distribution.json').exists()
          assert (root/'latest_iron_condor.json').exists()
          assert (root/'status.json').exists()
          print(json.dumps(s,indent=2))
          PY
      - name: Commit V8.1 research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v8/research
          git diff --cached --quiet || git commit -m 'Publish V8.1 coherent iron condor research results [skip ci]'
          git pull --rebase origin v8.1-coherent-ic-wfo
          git push origin v8.1-coherent-ic-wfo
