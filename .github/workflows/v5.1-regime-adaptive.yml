name: V5.1 Regime Adaptive Options Research

on:
  workflow_dispatch:
  push:
    branches: [v5.1-regime-adaptive-repair]
    paths:
      - 'v5/**'
      - 'scripts/download_v5_market_context.py'
      - 'scripts/download_v5_flow_context.py'
      - 'scripts/download_nifty_nse_history.py'
      - '.github/workflows/v5.1-regime-adaptive.yml'

permissions:
  contents: write

concurrency:
  group: v5.1-regime-adaptive
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      NSE_HISTORY_START: '2015-01-01'
      NSE_HISTORY_END: '2026-09-16'
      NSE_HISTORY_WORKERS: '5'
      HF_NEWS_URL: 'https://huggingface.co/datasets/mveen3/Six_Year_Indian_Stock_Market_Dataset-News_and_Ticker/resolve/394913e6b62d643b6449538cf6d70f7f36bd0678/dataset/news_sentiment.csv?download=true'
    steps:
      - name: Checkout V5.1 branch
        uses: actions/checkout@v4
        with:
          ref: v5.1-regime-adaptive-repair

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight
        run: python -m py_compile v5/run.py scripts/download_v5_market_context.py scripts/download_v5_flow_context.py

      - name: Download complete NIFTY options and futures history
        run: python scripts/download_nifty_nse_history.py

      - name: Download market context
        run: python scripts/download_v5_market_context.py

      - name: Download FII/DII/PCR context
        run: python scripts/download_v5_flow_context.py

      - name: Download historical news sentiment
        run: |
          mkdir -p data/cache
          python - <<'PY'
          import os, requests
          u=os.environ['HF_NEWS_URL']
          out='data/cache/v5_news_daily.csv'
          r=requests.get(u,timeout=120,headers={'User-Agent':'V5-research/1.0'})
          r.raise_for_status()
          open(out,'wb').write(r.content)
          print('news bytes',len(r.content))
          PY

      - name: Normalize V5.1 news schema
        run: |
          python - <<'PY'
          import pandas as pd
          p='data/cache/v5_news_daily.csv'
          n=pd.read_csv(p)
          n.columns=[str(c).strip().lower() for c in n.columns]
          if 'date' not in n.columns:
              raise RuntimeError(f'Missing date column after normalization: {list(n.columns)}')
          if not any('news_' in c for c in n.columns):
              raise RuntimeError(f'Missing news_* columns after normalization: {list(n.columns)}')
          n.to_csv(p,index=False)
          print('normalized news columns:', list(n.columns))
          PY

      - name: Validate research inputs
        run: |
          test -s data/cache/nifty_options_long.parquet
          test -s data/cache/nifty_futures_long.parquet
          test -s data/cache/v5_market_context.parquet
          test -s data/cache/v5_flow_context.parquet
          test -s data/cache/v5_news_daily.csv
          python - <<'PY'
          import pandas as pd
          n=pd.read_csv('data/cache/v5_news_daily.csv', nrows=5)
          print('news columns:', list(n.columns))
          assert 'date' in n.columns
          assert any('news_' in c for c in n.columns)
          PY

      - name: Run V5.1 hardened walk-forward
        run: python v5/run.py

      - name: Validate V5.1 outputs and economic invariants
        run: |
          test -s v5/research/summary.json
          test -s v5/research/oos_trade_ledger.csv
          test -s v5/research/walk_forward_summary.json
          test -s v5/research/regime_learning.json
          python - <<'PY'
          import json, pandas as pd
          s=json.load(open('v5/research/summary.json'))
          t=pd.read_csv('v5/research/oos_trade_ledger.csv')
          print(json.dumps(s['overall_oos'], indent=2))
          assert s['max_lots_per_trade']==1
          if len(t):
              assert (t['lots']==1).all()
              assert (t['qty']==t['lot_size']).all()
              assert (t['gross_pnl'] <= t['theoretical_max_profit'] + t['theoretical_max_profit'].abs()*0.03 + 10).all()
              assert (t['gross_pnl'] >= t['theoretical_max_loss'] - t['theoretical_max_loss'].abs()*0.03 - 10).all()
          assert len(s['walk_forward']) == 6
          PY

      - name: Commit V5.1 research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5/research
          git diff --cached --quiet || git commit -m 'Publish V5.1 hardened regime-adaptive research results'
          git pull --rebase origin v5.1-regime-adaptive-repair
          git push origin v5.1-regime-adaptive-repair

      - name: Upload V5.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5.1-regime-adaptive-research
          path: v5/research/
          if-no-files-found: error
