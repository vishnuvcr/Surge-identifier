name: CPR v1.0 Smoke Backtest

on:
  workflow_dispatch:
  schedule:
    # Run after the NSE session on weekdays (22:30 IST / 17:00 UTC).
    - cron: "0 17 * * 1-5"
  push:
    paths:
      - '.github/workflows/cpr-v1-launcher.yml'

permissions:
  contents: read

env:
  # The CPR scripts import the repository's src/ package directly.
  PYTHONPATH: ${{ github.workspace }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CPR v1.0 branch
        uses: actions/checkout@v4
        with:
          ref: CPR-v1.0
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPR-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy>=2.0,<3' \
            'pandas>=2.2,<3' \
            'pyarrow>=17,<23' \
            'requests>=2.32,<3' \
            'scikit-learn>=1.5,<2' \
            'pyyaml>=6,<7'

      - name: Verify CPR source imports
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          print('Python:', sys.version)
          print('Workspace:', Path.cwd())
          print('PYTHONPATH:', sys.path)
          from src.cpr_v1_engine import CPRConfig, period_levels, STRATEGIES
          print('CPR import OK; strategies:', sorted(STRATEGIES))
          PY

      - name: Bootstrap 1-minute public NSE data and resample to 5-minute
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/bootstrap_cpr_v1_data.py \
            --symbols "RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS"

      - name: Validate downloaded data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('data/cpr_v1/intraday')
          files = sorted(root.glob('*.parquet'))
          print('Downloaded files:', [f.name for f in files])
          if len(files) != 5:
              raise SystemExit(f'Expected 5 symbol files, found {len(files)}')
          for f in files:
              df = pd.read_parquet(f)
              required = {'timestamp','symbol','open','high','low','close','volume'}
              missing = required - set(df.columns)
              if missing or df.empty:
                  raise SystemExit(f'{f}: missing={missing}, rows={len(df)}')
              print(f'{f.name}: rows={len(df)}, start={df.timestamp.min()}, end={df.timestamp.max()}')
          PY

      - name: Run CPR strategy smoke backtest
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONWARNINGS: 'ignore::FutureWarning'
        run: |
          python scripts/run_cpr_v1_backtest.py \
            --data-dir data/cpr_v1/intraday \
            --output-dir reports/cpr_v1 \
            --symbols "RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS" \
            --capital 100000 \
            --risk-fraction 0.01 \
            --max-position-fraction 0.50 \
            --cost-bps-side 8 \
            --slippage-bps-side 3

      - name: Upload CPR v1.0 smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-v1-smoke-report
          path: reports/cpr_v1/
          if-no-files-found: warn
