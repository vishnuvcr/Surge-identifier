name: NIFTY Weekly Iron Condor Research

on:
  workflow_dispatch:
  push:
    branches: [iron-condor-weekly-research]

concurrency:
  group: iron-condor-research
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iron-condor-weekly-research

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch validated NSE F&O archive mirror
        run: |
          rm -rf /tmp/nse-fno-data-bank
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/SantoshSrinivas79/NSE-FNO-Data-bank.git /tmp/nse-fno-data-bank
          cd /tmp/nse-fno-data-bank
          git sparse-checkout init --cone
          git sparse-checkout set data/2025 data/2026
          git checkout
          echo "Archive count: $(find data/2025 data/2026 -type f -name '*.zip' | wc -l)"
          test "$(find data/2025 data/2026 -type f -name '*.zip' | wc -l)" -gt 300

      - name: Build NIFTY option dataset
        run: |
          python - <<'PY'
          from src.nse_options import load_nifty_options
          x = load_nifty_options('data/cache', lookback_days=600)
          print('rows=', len(x))
          print('dates=', x['date'].min(), 'to', x['date'].max())
          print('contracts=', x[['expiry','strike','option_type']].drop_duplicates().shape[0])
          print('option_rows=', len(x[x['option_type'].isin(['CE','PE'])]))
          assert len(x) > 10000, 'Insufficient NIFTY option history after archive parsing'
          assert x['date'].nunique() > 200, 'Insufficient trading-day coverage'
          assert x['underlying_close'].notna().mean() > 0.95, 'Missing NIFTY futures underlying proxy'
          PY

      - name: Run walk-forward iron condor research
        run: python scripts/run_iron_condor_research.py

      - name: Validate research artifacts
        run: |
          test -s backtest/results/iron-condor/training_leaderboard.csv
          test -s backtest/results/iron-condor/oos_summary.json
          python - <<'PY'
          import json
          x = json.load(open('backtest/results/iron-condor/oos_summary.json'))
          print(json.dumps(x, indent=2))
          assert x.get('data_ok') is True
          assert x.get('trades', 0) > 0
          PY

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nifty-iron-condor-research
          path: |
            backtest/results/iron-condor/
            data/cache/nifty_options.parquet
          if-no-files-found: error
