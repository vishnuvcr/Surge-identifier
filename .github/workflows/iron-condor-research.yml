name: NIFTY Weekly Iron Condor Research

on:
  workflow_dispatch:
  push:
    branches: [iron-condor-weekly-research]

concurrency:
  group: iron-condor-weekly-research
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  IRON_CONDOR_LOOKBACK_DAYS: "2500"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iron-condor-weekly-research

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "pyarrow>=17,<23" "requests>=2.32,<3" "scikit-learn>=1.5,<2" "pyyaml>=6,<7" --no-cache-dir
          pip install kagglehub --no-cache-dir

      - name: Download public Kaggle NIFTY datasets
        run: |
          python - <<'PY'
          import kagglehub
          from pathlib import Path
          datasets = [
              "ayushsacri/indian-nifty-and-banknifty-options-data-2020-2024",
              "pariminikhil/nifty-option-chain-3-oct-24-to-24-mar-26",
          ]
          roots = []
          for ds in datasets:
              p = Path(kagglehub.dataset_download(ds))
              print(f"{ds} -> {p}")
              if not p.exists():
                  raise RuntimeError(f"Dataset path does not exist: {p}")
              roots.append(str(p))
          Path("/tmp/kaggle_roots.txt").write_text(":".join(roots))
          print("Kaggle roots:", roots)
          PY
          echo "KAGGLE_DATASET_ROOTS=$(cat /tmp/kaggle_roots.txt)" >> "$GITHUB_ENV"

      - name: Build combined NIFTY option dataset
        run: |
          mkdir -p data/cache
          python - <<'PY'
          from src.nse_options import load_nifty_options
          x = load_nifty_options('data/cache', lookback_days=2500)
          print('rows=', len(x))
          print('dates=', x['date'].min(), 'to', x['date'].max())
          print('trading_days=', x['date'].nunique())
          print('expiries=', x['expiry'].nunique())
          print('contracts=', x[['expiry','strike','option_type']].drop_duplicates().shape[0])
          print('option_rows=', len(x[x['option_type'].isin(['CE','PE'])]))
          print('underlying_coverage=', x['underlying_close'].notna().mean())
          assert len(x) > 100000, 'Insufficient combined NIFTY option history'
          assert x['date'].nunique() > 700, 'Insufficient trading-day coverage'
          assert x['underlying_close'].notna().mean() > 0.95, 'Missing NIFTY underlying proxy'
          assert x['date'].max().year >= 2026, 'Recent Kaggle option dataset not loaded'
          PY

      - name: Run 70/30 walk-forward iron condor research
        run: python scripts/run_iron_condor_research.py

      - name: Validate research artifacts
        run: |
          test -s backtest/results/iron-condor/oos_summary.json
          test -s backtest/results/iron-condor/leaderboard.csv
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          root = Path('backtest/results/iron-condor')
          summary = json.loads((root/'oos_summary.json').read_text())
          board = pd.read_csv(root/'leaderboard.csv')
          print('OOS summary:', json.dumps(summary, indent=2))
          print('Leaderboard rows:', len(board))
          print('Trades:', summary.get('oos_trades'))
          if summary.get('data_ok') is not True:
              raise SystemExit('Research data_ok flag is not true')
          if int(summary.get('oos_trades', 0)) <= 0:
              raise SystemExit('OOS produced zero trades')
          if len(board) == 0:
              raise SystemExit('Empty leaderboard')
          PY

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iron-condor-research-${{ github.run_number }}
          path: |
            backtest/results/iron-condor/
            data/cache/nifty_options.parquet
          retention-days: 30
