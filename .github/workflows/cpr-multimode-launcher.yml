name: CPR Multi-Mode Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  multimode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CPR multi-mode branch
        uses: actions/checkout@v4
        with:
          ref: CPR-multimode-v1
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'pyarrow>=17,<23' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'pyyaml>=6,<7'

      - name: Verify multi-mode imports
        run: |
          python - <<'PY'
          from src.cpr_multimode_v2 import STRATEGIES, prepare_context, generate_intraday, generate_daily
          print('CPR multi-mode import OK')
          print('Strategies:', ', '.join(STRATEGIES))
          PY

      - name: Bootstrap 1-minute NSE data and resample to 5-minute
        run: |
          python scripts/bootstrap_cpr_v1_data.py \
            --symbols 'RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS' \
            --output-dir data/cpr_v1/intraday

      - name: Validate source data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('data/cpr_v1/intraday')
          files=sorted(root.glob('*.parquet'))
          print('Files:', [f.name for f in files])
          if len(files) != 5:
              raise SystemExit(f'Expected 5 files, found {len(files)}')
          for f in files:
              df=pd.read_parquet(f)
              req={'timestamp','symbol','open','high','low','close','volume'}
              miss=req-set(df.columns)
              if miss or df.empty: raise SystemExit(f'{f}: missing={miss}, rows={len(df)}')
              print(f'{f.name}: {len(df):,} rows | {df.timestamp.min()} -> {df.timestamp.max()}')
          PY

      - name: Run intraday + swing + BTST backtests
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONWARNINGS: 'ignore::FutureWarning'
        run: |
          python scripts/run_cpr_multimode.py \
            --data-dir data/cpr_v1/intraday \
            --output-dir reports/cpr_multimode \
            --symbols 'RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS' \
            --mode all \
            --capital 100000 \
            --risk-fraction 0.01 \
            --max-position-fraction 0.50 \
            --cost-bps-side 8 \
            --slippage-bps-side 3 \
            --max-swing-days 10

      - name: Upload multi-mode report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-multimode-report
          path: reports/cpr_multimode/
          if-no-files-found: warn
