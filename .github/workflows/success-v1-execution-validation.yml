name: Success V1 Execution and Path Validation

on:
  workflow_dispatch:
  push:
    branches: [success-v1-execution-validation]

concurrency:
  group: success-v1-execution-validation
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      NSE_HISTORY_START: "2015-01-01"
      NSE_HISTORY_WORKERS: "5"
      IRON_CONDOR_DATA_PATH: data/cache/nifty_options_long.parquet
      IRON_CONDOR_FUTURES_PATH: data/cache/nifty_futures_long.parquet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: success-v1-execution-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "pyarrow>=17,<23" "requests>=2.32,<3" "pyyaml>=6,<7"
      - name: Download full NSE option and futures history
        run: python scripts/download_nifty_nse_history.py
      - name: Run execution/path and walk-forward validation
        run: python scripts/run_success_v1_execution_validation.py
      - name: Validate outputs
        run: |
          test -s backtest/results/success-v1-validation/validation_summary.json
          test -s backtest/results/success-v1-validation/execution_bias_comparison.csv
          test -s backtest/results/success-v1-validation/slippage_sensitivity.csv
          test -s backtest/results/success-v1-validation/walk_forward_results.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtest/results/success-v1-validation/validation_summary.json')
          s=json.loads(p.read_text())
          print(json.dumps(s, indent=2))
          assert s['walk_forward_windows'] == 8
          assert s['next_session_close']['trades'] > 0
          PY
      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: success-v1-execution-validation-${{ github.run_number }}
          path: backtest/results/success-v1-validation/
          retention-days: 30
