name: Launch Phase 6.2 Backtest

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Historical lookback for persistent master-data bootstrap/refresh'
        required: false
        default: '1500'
      force_rebuild:
        description: 'Rebuild the persistent master dataset from NSE'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch persistent master-data preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prepare-master-data.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref phase6.2-persistent-master-data \
            -f lookback_days='${{ inputs.lookback_days }}' \
            -f force_rebuild='${{ inputs.force_rebuild }}'
          echo 'Persistent master-data workflow dispatched.'
