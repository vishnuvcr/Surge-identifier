name: V7 Deep Multimodal NIFTY Expiry Research

on:
  workflow_dispatch:
  push:
    branches:
      - v7-deep-multimodal-expiry
    paths:
      - 'v6.2/**'
      - '.github/workflows/v6.2-multimodal-nifty-expiry.yml'
      - 'scripts/**'
      - 'v5/**'
      - 'requirements.txt'

concurrency:
  group: v7-deep-multimodal-expiry
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      NSE_HISTORY_START: '2015-01-01'
      NSE_HISTORY_END: '2026-09-16'
      NSE_HISTORY_WORKERS: '5'
      V62_PRICE_WORKERS: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v7-deep-multimodal-expiry
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect V7 implementation
        run: python v6.2/v7_inspector.py

      - name: Compile V7 implementation
        run: python -m py_compile v6.2/v7_inspector.py v6.2/multimodal_engine.py v6.2/v7_latest_forecast.py v6.2/download_multimodal_data.py v6.2/download_fii_dii_kaggle.py v6.2/download_news_robust.py

      - name: Download NIFTY options and futures history
        run: python scripts/download_nifty_nse_history.py

      - name: Download market context
        run: python scripts/download_v5_market_context.py

      - name: Download legacy flow context (fallback/reference)
        run: python scripts/download_v5_flow_context.py

      - name: Download Kaggle FII DII historical dataset
        run: python v6.2/download_fii_dii_kaggle.py

      - name: Download historical news
        run: python v6.2/download_news_robust.py

      - name: Download multimodal constituent and index data
        run: python v6.2/download_multimodal_data.py

      - name: Re-apply Kaggle FII DII dataset after multimodal download
        run: python v6.2/download_fii_dii_kaggle.py

      - name: Validate raw inputs
        run: |
          set -e
          for f in data/cache/nifty_options_long.parquet data/cache/nifty_futures_long.parquet data/cache/v5_market_context.parquet data/cache/v5_news_daily.csv data/cache/v62_news_manifest.json data/cache/v62_nifty50_index.parquet data/cache/v62_constituent_prices.parquet data/cache/v62_constituent_weights.csv data/cache/v62_nifty50_membership.csv data/cache/v62_fii_dii.parquet data/cache/v62_fii_dii_manifest.json; do test -s "$f" || { echo "missing $f"; exit 1; }; done

      - name: Run V7 deep multimodal research
        run: python v6.2/multimodal_engine.py

      - name: Verify latest V7 forecast
        run: python v6.2/v7_latest_forecast.py

      - name: Validate V7 research outputs
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('v6.2/research')
          required=['summary.json','status.json','latest_forecast.json','latest_paper_trade.csv','walk_forward_model_metrics.csv','split_70_30_model_metrics.csv','split_70_30_predictions.csv','new_oos_model_metrics.csv','new_oos_predictions.csv']
          for p in required:
              assert (root/p).exists() and (root/p).stat().st_size>0, p
          s=json.load(open(root/'summary.json')); f=json.load(open(root/'latest_forecast.json'))
          flow=json.load(open('data/cache/v62_fii_dii_manifest.json')); news=json.load(open('data/cache/v62_news_manifest.json'))
          assert s['version']=='V7'
          assert s['sample_count'] >= 300, s['sample_count']
          assert s['feature_count_global'] >= 20, s['feature_count_global']
          assert s['constituent_symbols'] >= 40, s['constituent_symbols']
          assert s['history_end']=='2026-09-16'
          assert s['new_oos_start']=='2026-04-01'
          assert s['selected_production_model']=='deep_transformer'
          assert f['available'] is True and f['forecast_feature_date_verified'] is True
          assert f['signal_date']==f['latest_feature_date']
          assert pd.Timestamp(f['next_expiry']) > pd.Timestamp('2026-09-16')
          o=pd.read_csv(root/'new_oos_predictions.csv')
          assert len(o)>0
          assert (pd.to_datetime(o['expiry']) <= pd.Timestamp('2026-09-16')).all()
          print(json.dumps({'samples':s['sample_count'],'global_features':s['feature_count_global'],'constituents':s['constituent_symbols'],'latest_forecast':f,'fii_dii':flow,'news':news,'new_oos':s['new_oos']},indent=2))
          PY

      - name: Commit V7 research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v6.2/research
          git diff --cached --quiet || git commit -m 'Publish V7 deep multimodal NIFTY research results [skip ci]'
          git pull --rebase origin v7-deep-multimodal-expiry
          git push origin v7-deep-multimodal-expiry
