name: Surge Strategy Backtest

on:
  workflow_dispatch:
  push:
    branches: [backtest-paytm-intraday]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore NSE data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nse-backtest-${{ github.run_id }}
          restore-keys: |
            nse-backtest-
            nse-surge-data-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run point-in-time daily-trade backtest
        run: python backtest/run_backtest_daily.py

      - name: Commit backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results
          git diff --cached --quiet || git commit -m "Add daily-trade Paytm Money backtest results"
          git push

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: surge-backtest-results
          path: backtest/results
