name: Surge Strategy Backtest Phase 6.5

on:
  workflow_dispatch:

concurrency:
  group: surge-phase65
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6.5-bidirectional-adaptive-moe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify repository import path
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path.cwd().resolve()
          if str(root) not in sys.path:
              sys.path.insert(0, str(root))
          import src
          print('Repository import OK:', root)
          PY
      - name: Restore persistent NSE master dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/master-release data/cache
          gh release download phase62-data \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'phase62-master-data.tar.zst' \
            --dir /tmp/master-release \
            --clobber
          tar -C data -I 'zstd -T0' -xf /tmp/master-release/phase62-master-data.tar.zst
      - name: Validate persistent master dataset
        run: |
          test -s data/cache/prices.parquet
          test -s data/cache/fo.parquet
          test -s data/cache/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          m = json.loads(Path('data/cache/manifest.json').read_text())
          p = pd.read_parquet('data/cache/prices.parquet', columns=['date','symbol'])
          f = pd.read_parquet('data/cache/fo.parquet', columns=['date','symbol'])
          assert len(p) > 1000 and len(f) > 1000
          assert int(m['cash']['rows']) == len(p)
          assert int(m['fno']['rows']) == len(f)
          print('Master dataset OK:', len(p), 'cash rows;', len(f), 'F&O rows')
          PY
      - name: Normalize Phase 6.5 target-key compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/moe_engine_phase65.py')
          text = path.read_text()
          replacements = {
              'short_hit_025': 'short_hit_p025',
              'long_hit_025': 'long_hit_p025',
              'short_hit_2p5': 'short_hit_p025',
              'long_hit_2p5': 'long_hit_p025',
          }
          before = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          print('Phase 6.5 target-key normalization:', 'changed' if text != before else 'already compatible')
          PY
          python - <<'PY'
          from pathlib import Path
          text = Path('src/moe_engine_phase65.py').read_text()
          assert 'short_hit_025' not in text
          assert 'long_hit_025' not in text
          assert 'short_hit_2p5' not in text
          assert 'long_hit_2p5' not in text
          assert 'short_hit_p025' in text
          assert 'long_hit_p025' in text
          print('Phase 6.5 target-key compatibility check passed')
          PY
      - name: Run Phase 6.5 bidirectional adaptive MoE
        env:
          PHASE65_OUTPUT_DIR: backtest/results/phase65
        run: python backtest/run_backtest_phase65.py
      - name: Validate Phase 6.5 results
        run: |
          test -s backtest/results/phase65/summary.json
          python - <<'PY'
          import json
          x = json.load(open('backtest/results/phase65/summary.json'))
          assert x['phase'] == '6.5'
          assert x['engine'] == 'bidirectional_long_short_adaptive_moe_with_contrarian_layer'
          assert 'diagnostics' in x and 'summaries' in x
          print('Phase 6.5 result validation passed')
          print('trade_days=', x['diagnostics']['trade_days'])
          print('long_trades=', x['diagnostics']['long_trades'])
          print('short_trades=', x['diagnostics']['short_trades'])
          print('contrarian_trades=', x['diagnostics']['contrarian_trades'])
          PY
      - name: Upload Phase 6.5 results
        uses: actions/upload-artifact@v4
        with:
          name: surge-phase65-results
          path: backtest/results/phase65/
          if-no-files-found: error
