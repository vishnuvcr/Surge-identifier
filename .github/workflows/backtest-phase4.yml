name: Surge Strategy Backtest Phase 4

on:
  push:
    branches: [backtest-paytm-intraday]
    paths-ignore:
      - 'backtest/results/phase4/**'
      - 'src/moe_engine.py'
      - 'backtest/run_backtest_phase6.py'
      - 'backtest/config_phase6.yaml'
      - 'backtest/results/phase6/**'
      - 'data/events/**'
      - '.github/workflows/backtest-phase6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: backtest-paytm-intraday
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: phase4-pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            phase4-pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Phase 4 backtest
        run: python backtest/run_backtest_phase4.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: surge-backtest-phase4-results
          path: backtest/results/phase4
          retention-days: 30

      - name: Commit Phase 4 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results/phase4
          if git diff --cached --quiet; then
            echo "No Phase 4 result changes to commit"
            exit 0
          fi
          git commit -m "Update Phase 4 backtest results"
          git fetch origin backtest-paytm-intraday
          git rebase origin/backtest-paytm-intraday
          git push origin HEAD:backtest-paytm-intraday
