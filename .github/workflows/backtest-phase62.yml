name: Surge Strategy Backtest Phase 6.2

on:
  workflow_dispatch:
  push:
    branches: [phase6.2-parallel-long-history]
    paths:
      - 'src/**'
      - 'backtest/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/backtest-phase62.yml'

concurrency:
  group: surge-phase62-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download full Phase 6.2 data once
        run: |
          python - <<'PY'
          import yaml
          from src.nse_data import load_prices
          from src.nse_fo import load_fo
          cfg = yaml.safe_load(open('backtest/config_phase62.yaml'))
          lookback = int(cfg['lookback_days'])
          print(f'Preparing {lookback} calendar days of cash + F&O data', flush=True)
          prices = load_prices('data/cache', lookback)
          fo = load_fo('data/cache', lookback)
          print(f'Prepared prices={len(prices):,} F&O={len(fo):,}', flush=True)
          PY
      - name: Cache prepared data for all shards
        uses: actions/cache@v4
        with:
          path: data/cache
          key: phase62-data-v1-${{ runner.os }}-${{ hashFiles('backtest/config_phase62.yaml', 'src/nse_data.py', 'src/nse_fo.py') }}

  backtest:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - start: '2023-01-01'
            end: '2023-07-01'
          - start: '2023-07-01'
            end: '2024-01-01'
          - start: '2024-01-01'
            end: '2024-07-01'
          - start: '2024-07-01'
            end: '2025-01-01'
          - start: '2025-01-01'
            end: '2025-07-01'
          - start: '2025-07-01'
            end: '2026-01-01'
          - start: '2026-01-01'
            end: '2026-10-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore prepared data
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: phase62-data-v1-${{ runner.os }}-${{ hashFiles('backtest/config_phase62.yaml', 'src/nse_data.py', 'src/nse_fo.py') }}
      - name: Run Phase 6.2 shard
        env:
          PHASE62_BLOCK_START: ${{ matrix.start }}
          PHASE62_BLOCK_END: ${{ matrix.end }}
          PHASE62_OUTPUT_DIR: backtest/results/phase62/${{ matrix.start }}_${{ matrix.end }}
        run: python backtest/run_backtest_phase62.py
      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: phase62-${{ matrix.start }}-${{ matrix.end }}
          path: backtest/results/phase62/${{ matrix.start }}_${{ matrix.end }}/
          if-no-files-found: error

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all Phase 6.2 shard results
        uses: actions/download-artifact@v4
        with:
          pattern: phase62-*
          path: backtest/results/phase62/blocks
          merge-multiple: false
      - name: Validate shard outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('backtest/results/phase62/blocks')
          files = sorted(root.rglob('*')) if root.exists() else []
          print(f'Found {len(files)} result files/directories')
          for f in files:
              if f.is_file():
                  print(f'{f} {f.stat().st_size} bytes')
          print('Chronological aggregation is intentionally deferred until every shard passes schema and leakage validation.')
          PY
      - name: Upload combined shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surge-phase62-results
          path: backtest/results/phase62/blocks/
          if-no-files-found: error
