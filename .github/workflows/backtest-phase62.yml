name: Surge Strategy Backtest Phase 6.2

on:
  workflow_dispatch:
  push:
    branches: [phase6.2-parallel-long-history]
    paths:
      - 'src/**'
      - 'backtest/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/backtest-phase62.yml'

concurrency:
  group: surge-phase62-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate code and config before data work
        run: python backtest/phase62_preflight.py --config-only
      - name: Download full Phase 6.2 data once
        run: |
          python - <<'PY'
          import yaml
          from src.nse_data import load_prices
          from src.nse_fo import load_fo
          cfg = yaml.safe_load(open('backtest/config_phase62.yaml'))
          lookback = int(cfg['lookback_days'])
          print(f'Preparing up to {lookback} calendar days of cash + F&O data', flush=True)
          prices = load_prices('data/cache', lookback)
          fo = load_fo('data/cache', lookback)
          assert len(prices) > 1000, f'Cash data unexpectedly small: {len(prices)} rows'
          assert not prices.empty and {'date','symbol','open','high','low','close','volume'}.issubset(prices.columns)
          assert not fo.empty and {'date','symbol','fut_oi','fut_oi_change','fut_volume','call_oi','put_oi','pcr'}.issubset(fo.columns)
          print(f'Prepared prices={len(prices):,} F&O={len(fo):,}', flush=True)
          PY
      - name: Validate prepared cache and discover chronological blocks
        id: discover
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import pandas as pd
          import yaml

          cfg = yaml.safe_load(open('backtest/config_phase62.yaml'))
          p = Path('data/cache/prices.parquet')
          f = Path('data/cache/fo.parquet')
          assert p.exists(), 'prices.parquet missing after preparation'
          assert f.exists(), 'fo.parquet missing after preparation'

          px = pd.read_parquet(p, columns=['date','symbol'])
          fo = pd.read_parquet(f, columns=['date','symbol'])
          px['date'] = pd.to_datetime(px['date']).dt.normalize()
          fo['date'] = pd.to_datetime(fo['date']).dt.normalize()
          cash_dates = sorted(px.date.unique())
          fo_dates = sorted(fo.date.unique())

          min_train = int(cfg['min_train_days'])
          assert len(cash_dates) >= min_train + 5, f'Insufficient cash history: {len(cash_dates)} dates'
          assert len(fo_dates) >= min(120, len(cash_dates)), f'Insufficient F&O history: {len(fo_dates)} dates'

          min_date = pd.Timestamp(cash_dates[0])
          max_date = pd.Timestamp(cash_dates[-1])
          print(f'cache OK: cash_dates={len(cash_dates)} fo_dates={len(fo_dates)} min={min_date.date()} max={max_date.date()}', flush=True)

          blocks = []
          cursor = pd.Timestamp(min_date.year, min_date.month, 1)
          end_limit = max_date + pd.Timedelta(days=1)
          while cursor < end_limit:
              nxt = cursor + pd.DateOffset(months=6)
              block_end = min(nxt, end_limit)
              blocks.append({
                  'start': cursor.strftime('%Y-%m-%d'),
                  'end': block_end.strftime('%Y-%m-%d'),
              })
              cursor = nxt

          assert blocks, 'No chronological backtest blocks discovered'
          assert all(b['start'] < b['end'] for b in blocks), f'Invalid block boundaries: {blocks}'
          assert all(blocks[i]['end'] == blocks[i + 1]['start'] for i in range(len(blocks) - 1)), f'Non-contiguous blocks: {blocks}'
          assert blocks[0]['start'] <= min_date.strftime('%Y-%m-%d') < blocks[-1]['end']
          assert blocks[-1]['end'] > max_date.strftime('%Y-%m-%d')

          matrix = {'block': blocks}
          matrix_json = json.dumps(matrix, separators=(',', ':'))
          print('discovered matrix:', matrix_json, flush=True)

          # GITHUB_OUTPUT must contain one valid name=value record.
          # The matrix itself is an object whose block key is an array of objects;
          # this is the supported form for a dynamically generated GitHub Actions matrix.
          print('matrix=' + matrix_json)
          PY
      - name: Cache prepared data for all shards
        uses: actions/cache@v4
        with:
          path: data/cache
          key: phase62-data-v5-${{ runner.os }}-${{ hashFiles('backtest/config_phase62.yaml', 'src/nse_data.py', 'src/nse_fo.py') }}

  backtest:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare-data.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore prepared data
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: phase62-data-v5-${{ runner.os }}-${{ hashFiles('backtest/config_phase62.yaml', 'src/nse_data.py', 'src/nse_fo.py') }}
          fail-on-cache-miss: true
      - name: Validate restored cache and shard configuration
        env:
          PHASE62_BLOCK_START: ${{ matrix.block.start }}
          PHASE62_BLOCK_END: ${{ matrix.block.end }}
        run: |
          python backtest/phase62_preflight.py
          python - <<'PY'
          import pandas as pd
          px = pd.read_parquet('data/cache/prices.parquet', columns=['date'])
          dates = pd.to_datetime(px['date']).dt.normalize()
          start = pd.Timestamp('${{ matrix.block.start }}')
          end = pd.Timestamp('${{ matrix.block.end }}')
          assert dates.min() < end, f'Block {start.date()}-{end.date()} has no available cash history'
          assert dates.max() >= start, f'Block {start.date()}-{end.date()} lies after available cash history'
          print(f'Shard cache/config OK: available={dates.min().date()}..{dates.max().date()} block={start.date()}..{end.date()}')
          PY
      - name: Run Phase 6.2 shard
        env:
          PHASE62_BLOCK_START: ${{ matrix.block.start }}
          PHASE62_BLOCK_END: ${{ matrix.block.end }}
          PHASE62_OUTPUT_DIR: backtest/results/phase62/${{ matrix.block.start }}_${{ matrix.block.end }}
        run: python backtest/run_backtest_phase62.py
      - name: Validate shard outputs
        env:
          PHASE62_OUTPUT_DIR: backtest/results/phase62/${{ matrix.block.start }}_${{ matrix.block.end }}
        run: |
          test -d "$PHASE62_OUTPUT_DIR"
          test -s "$PHASE62_OUTPUT_DIR/summary.json"
          python - <<'PY'
          import json, os
          p = os.environ['PHASE62_OUTPUT_DIR'] + '/summary.json'
          x = json.load(open(p))
          required = {'diagnostics','summaries','runtime_seconds'}
          missing = required - set(x)
          assert not missing, f'Missing result fields: {missing}'
          print('Shard output schema OK')
          PY
      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: phase62-${{ matrix.block.start }}-${{ matrix.block.end }}
          path: backtest/results/phase62/${{ matrix.block.start }}_${{ matrix.block.end }}/
          if-no-files-found: error

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download all Phase 6.2 shard results
        uses: actions/download-artifact@v4
        with:
          pattern: phase62-*
          path: backtest/results/phase62/blocks
          merge-multiple: false
      - name: Validate all shard outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('backtest/results/phase62/blocks')
          summaries = sorted(root.rglob('summary.json'))
          print(f'Found {len(summaries)} shard summaries')
          assert summaries, 'No shard summaries found'
          for p in summaries:
              x = json.loads(p.read_text())
              assert {'diagnostics','summaries','runtime_seconds'} <= set(x), f'Invalid {p}'
              print(p, 'OK')
          PY
      - name: Upload combined shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surge-phase62-results
          path: backtest/results/phase62/blocks/
          if-no-files-found: error
