name: Surge Strategy Backtest Phase 6.2

on:
  workflow_dispatch:
  push:
    branches: [phase6.2-persistent-master-data]
    paths:
      - 'src/**'
      - 'backtest/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/backtest-phase62.yml'

concurrency:
  group: surge-phase62-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      data_cache_key: ${{ steps.discover.outputs.data_cache_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate code and config before data work
        run: python backtest/phase62_preflight.py --config-only
      - name: Restore persistent master dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/master-release data/cache
          if ! gh release view phase62-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: persistent release phase62-data does not exist.'
            echo 'Run .github/workflows/prepare-master-data.yml once to bootstrap the NSE master dataset.'
            exit 1
          fi
          gh release download phase62-data --repo "$GITHUB_REPOSITORY" --pattern 'phase62-master-data.tar.zst' --dir /tmp/master-release --clobber
          tar -C data -I 'zstd -T0' -xf /tmp/master-release/phase62-master-data.tar.zst
      - name: Validate persistent master dataset and discover shards
        id: discover
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd
          import yaml

          cfg = yaml.safe_load(open('backtest/config_phase62.yaml'))
          p = Path('data/cache/prices.parquet')
          f = Path('data/cache/fo.parquet')
          m = Path('data/cache/manifest.json')
          assert p.exists(), 'prices.parquet missing from persistent snapshot'
          assert f.exists(), 'fo.parquet missing from persistent snapshot'
          assert m.exists(), 'manifest.json missing from persistent snapshot'

          px = pd.read_parquet(p, columns=['date','symbol'])
          fo = pd.read_parquet(f, columns=['date','symbol'])
          px['date'] = pd.to_datetime(px['date']).dt.normalize()
          fo['date'] = pd.to_datetime(fo['date']).dt.normalize()
          cash_dates = sorted(px.date.unique())
          fo_dates = sorted(fo.date.unique())
          manifest = json.loads(m.read_text())
          assert int(manifest['cash']['rows']) == len(pd.read_parquet(p, columns=['date'])), 'Cash manifest row count mismatch'
          assert int(manifest['fno']['rows']) == len(pd.read_parquet(f, columns=['date'])), 'F&O manifest row count mismatch'
          assert manifest['cash']['min_date'] == cash_dates[0].strftime('%Y-%m-%d')
          assert manifest['cash']['max_date'] == cash_dates[-1].strftime('%Y-%m-%d')
          min_train = int(cfg['min_train_days'])
          assert len(cash_dates) >= min_train + 5, f'Insufficient cash history: {len(cash_dates)} dates'
          assert len(fo_dates) >= min(120, len(cash_dates)), f'Insufficient F&O history: {len(fo_dates)} dates'

          min_date = pd.Timestamp(cash_dates[0])
          max_date = pd.Timestamp(cash_dates[-1])
          print(f'persistent dataset OK: cash_rows={len(pd.read_parquet(p, columns=["date"])):,} fo_rows={len(pd.read_parquet(f, columns=["date"])):,} cash_dates={len(cash_dates)} fo_dates={len(fo_dates)} min={min_date.date()} max={max_date.date()}', flush=True)

          blocks = []
          cursor = pd.Timestamp(min_date.year, min_date.month, 1)
          end_limit = max_date + pd.Timedelta(days=1)
          while cursor < end_limit:
              nxt = cursor + pd.DateOffset(months=6)
              block_end = min(nxt, end_limit)
              blocks.append({'start': cursor.strftime('%Y-%m-%d'), 'end': block_end.strftime('%Y-%m-%d')})
              cursor = nxt

          assert blocks, 'No chronological backtest blocks discovered'
          assert all(b['start'] < b['end'] for b in blocks)
          assert all(blocks[i]['end'] == blocks[i + 1]['start'] for i in range(len(blocks) - 1))
          assert blocks[0]['start'] <= min_date.strftime('%Y-%m-%d') < blocks[-1]['end']
          assert blocks[-1]['end'] > max_date.strftime('%Y-%m-%d')

          matrix_json = json.dumps({'include': blocks}, separators=(',', ':'))
          data_hash = hashlib.sha256(m.read_bytes()).hexdigest()[:16]
          cache_key = f'phase62-master-v1-{data_hash}'
          print('discovered matrix:', matrix_json, flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + matrix_json + '\n')
              out.write('data_cache_key=' + cache_key + '\n')
          PY
      - name: Cache persistent dataset for all shards
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ${{ steps.discover.outputs.data_cache_key }}

  backtest:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare-data.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore persistent prepared data
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ${{ needs.prepare-data.outputs.data_cache_key }}
          fail-on-cache-miss: true
      - name: Validate restored cache and shard configuration
        env:
          PHASE62_BLOCK_START: ${{ matrix.start }}
          PHASE62_BLOCK_END: ${{ matrix.end }}
        run: |
          python backtest/phase62_preflight.py
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          px = pd.read_parquet('data/cache/prices.parquet', columns=['date'])
          dates = pd.to_datetime(px['date']).dt.normalize()
          start = pd.Timestamp('${{ matrix.start }}')
          end = pd.Timestamp('${{ matrix.end }}')
          manifest = json.loads(Path('data/cache/manifest.json').read_text())
          assert dates.min() < end, f'Block {start.date()}-{end.date()} has no available cash history'
          assert dates.max() >= start, f'Block {start.date()}-{end.date()} lies after available cash history'
          assert manifest['cash']['min_date'] == dates.min().strftime('%Y-%m-%d')
          assert manifest['cash']['max_date'] == dates.max().strftime('%Y-%m-%d')
          print(f'Shard cache/config OK: available={dates.min().date()}..{dates.max().date()} block={start.date()}..{end.date()}')
          PY
      - name: Run Phase 6.2 shard
        env:
          PHASE62_BLOCK_START: ${{ matrix.start }}
          PHASE62_BLOCK_END: ${{ matrix.end }}
          PHASE62_OUTPUT_DIR: backtest/results/phase62/${{ matrix.start }}_${{ matrix.end }}
        run: python backtest/run_backtest_phase62.py
      - name: Validate shard outputs
        env:
          PHASE62_OUTPUT_DIR: backtest/results/phase62/${{ matrix.start }}_${{ matrix.end }}
        run: |
          test -d "$PHASE62_OUTPUT_DIR"
          test -s "$PHASE62_OUTPUT_DIR/summary.json"
          python - <<'PY'
          import json, os
          p = os.environ['PHASE62_OUTPUT_DIR'] + '/summary.json'
          x = json.load(open(p))
          required = {'diagnostics','summaries','runtime_seconds'}
          missing = required - set(x)
          assert not missing, f'Missing result fields: {missing}'
          print('Shard output schema OK')
          PY
      - name: Upload shard results
        uses: actions/upload-artifact@v4
        with:
          name: phase62-${{ matrix.start }}-${{ matrix.end }}
          path: backtest/results/phase62/${{ matrix.start }}_${{ matrix.end }}/
          if-no-files-found: error

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download all Phase 6.2 shard results
        uses: actions/download-artifact@v4
        with:
          pattern: phase62-*
          path: backtest/results/phase62/blocks
          merge-multiple: false
      - name: Validate all shard outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('backtest/results/phase62/blocks')
          summaries = sorted(root.rglob('summary.json'))
          print(f'Found {len(summaries)} shard summaries')
          assert summaries, 'No shard summaries found'
          for p in summaries:
              x = json.loads(p.read_text())
              assert {'diagnostics','summaries','runtime_seconds'} <= set(x), f'Invalid {p}'
              print(p, 'OK')
          PY
      - name: Write final status artifact
        run: |
          mkdir -p backtest/results/phase62/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('backtest/results/phase62/blocks')
          summaries = sorted(root.rglob('summary.json'))
          shard_runtime = []
          for p in summaries:
              x = json.loads(p.read_text())
              shard_runtime.append(float(x.get('runtime_seconds', 0.0)))
          payload = {
              'workflow': 'Surge Strategy Backtest Phase 6.2',
              'phase': 'backtest',
              'status': 'completed',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'commit': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'shards': len(summaries),
              'max_shard_runtime_seconds': max(shard_runtime) if shard_runtime else 0.0,
              'updated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('backtest/results/phase62/status/final_status.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Upload combined Phase 6.2 results
        uses: actions/upload-artifact@v4
        with:
          name: surge-phase62-results
          path: backtest/results/phase62/
          if-no-files-found: error

  status:
    if: ${{ always() }}
    needs: [prepare-data, backtest, aggregate]
    runs-on: ubuntu-latest
    steps:
      - name: Write final workflow status artifact
        run: |
          mkdir -p status
          PREPARE_RESULT='${{ needs.prepare-data.result }}'
          BACKTEST_RESULT='${{ needs.backtest.result }}'
          AGGREGATE_RESULT='${{ needs.aggregate.result }}'
          export PREPARE_RESULT BACKTEST_RESULT AGGREGATE_RESULT
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          results = {
              'prepare_data': os.environ['PREPARE_RESULT'],
              'backtest': os.environ['BACKTEST_RESULT'],
              'aggregate': os.environ['AGGREGATE_RESULT'],
          }
          overall = 'completed' if all(v == 'success' for v in results.values()) else 'failed'
          payload = {
              'workflow': 'Surge Strategy Backtest Phase 6.2',
              'phase': 'backtest',
              'status': overall,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'commit': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'job_results': results,
              'updated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('status/phase62_status.json').write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload, indent=2))
          PY
      - name: Upload final workflow status
        uses: actions/upload-artifact@v4
        with:
          name: phase62-status
          path: status/phase62_status.json
          if-no-files-found: error
