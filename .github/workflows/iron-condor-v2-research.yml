name: Iron Condor V2 Research

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "NSE history start date"
        required: false
        default: "2015-01-01"
      workers:
        description: "Parallel NSE download workers"
        required: false
        default: "5"

concurrency:
  group: iron-condor-v2-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      NSE_HISTORY_START: ${{ inputs.start_date || '2015-01-01' }}
      NSE_HISTORY_WORKERS: ${{ inputs.workers || '5' }}
      IRON_CONDOR_DATA_PATH: data/cache/nifty_options_long.parquet
      IRON_CONDOR_FUTURES_PATH: data/cache/nifty_futures_long.parquet
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: iron-condor-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "pyarrow>=17,<23" "requests>=2.32,<3" "scikit-learn>=1.5,<2" "pyyaml>=6,<7"

      - name: Download full NSE history
        run: python scripts/download_nifty_nse_history.py

      - name: Validate options and futures history
        run: |
          python - <<'PY'
          import pandas as pd
          o = pd.read_parquet('data/cache/nifty_options_long.parquet', columns=['date','option_type','close'])
          f = pd.read_parquet('data/cache/nifty_futures_long.parquet', columns=['date','expiry','close'])
          print('options', len(o), o.date.min(), o.date.max(), o.date.nunique(), o.option_type.value_counts().to_dict())
          print('futures', len(f), f.date.min(), f.date.max(), f.date.nunique())
          assert len(o) >= 500000
          assert o.date.nunique() >= 1500
          assert o.date.min().year <= 2015
          assert o.date.max().year >= 2026
          assert f.date.nunique() >= 1500
          assert f.date.min().year <= 2015
          assert f.date.max().year >= 2026
          assert set(o.option_type.unique()) == {'CE','PE'}
          assert (o.close > 0).all()
          assert (f.close > 0).all()
          PY

      - name: Run Iron Condor V2
        run: python scripts/run_iron_condor_v2.py

      - name: Validate V2 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('backtest/results/iron-condor-v2')
          required = ['v2_summary.json','oos_trades.csv','oos_trades.json','baseline_oos_trades.csv','walk_forward_results.csv','walk_forward_trades.csv','slippage_sensitivity.csv']
          for name in required:
              assert (out / name).exists(), name
          s = json.loads((out / 'v2_summary.json').read_text())
          assert s['oos']['trades'] > 0
          assert s['walk_forward_windows'] == 8
          print(json.dumps(s, indent=2))
          PY

      - name: Upload V2 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: iron-condor-v2-research-${{ github.run_number }}
          path: backtest/results/iron-condor-v2/
          retention-days: 30
