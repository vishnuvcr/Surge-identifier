name: CPR v1.0 Smoke Backtest

on:
  push:
    branches: ["CPR-v1.0"]
  schedule:
    # Run after the NSE session on weekdays (22:30 IST / 17:00 UTC).
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CPR v1.0
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyarrow requests

      - name: Bootstrap 1-minute public NSE data and resample to 5-minute
        run: |
          python scripts/bootstrap_cpr_v1_data.py \
            --symbols "RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS"

      - name: Run CPR strategy smoke backtest
        run: |
          python scripts/run_cpr_v1_backtest.py \
            --data-dir data/cpr_v1/intraday \
            --output-dir reports/cpr_v1 \
            --symbols "RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS" \
            --capital 100000 \
            --risk-fraction 0.01 \
            --max-position-fraction 0.50 \
            --cost-bps-side 8 \
            --slippage-bps-side 3

      - name: Upload CPR v1.0 smoke report
        uses: actions/upload-artifact@v4
        with:
          name: cpr-v1-smoke-report
          path: reports/cpr_v1/
