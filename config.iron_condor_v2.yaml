capital: 100000
underlying: NIFTY
entry_weekdays: [0, 1, 2, 3, 4]
min_days_to_expiry: 1
max_days_to_expiry: 7
short_distance_pct: [0.0125, 0.015, 0.0175, 0.02]
wing_width_points: [100, 150, 200, 250]
take_profit_credit_pct: [0.40, 0.50, 0.60, 0.70]
stop_loss_credit_multiple: [1.0, 1.25, 1.50, 2.0]
minimum_credit_points: [3.0, 5.0, 7.0, 10.0]
slippage_per_leg_points: [0.0, 0.25, 0.50, 1.0]
selection_slippage_per_leg_points: 0.50
max_overlapping_positions: 1
walk_forward_windows: 8
min_training_trades: 40
seed: 42

# Fixed expanding chronological windows. Training never includes the test period.
# The final test window automatically ends at the latest dataset date.
walk_forward_schedule:
  - train_end: "2018-12-31"
    test_start: "2019-01-01"
    test_end: "2019-12-31"
  - train_end: "2019-12-31"
    test_start: "2020-01-01"
    test_end: "2020-12-31"
  - train_end: "2020-12-31"
    test_start: "2021-01-01"
    test_end: "2021-12-31"
  - train_end: "2021-12-31"
    test_start: "2022-01-01"
    test_end: "2022-12-31"
  - train_end: "2022-12-31"
    test_start: "2023-01-01"
    test_end: "2023-12-31"
  - train_end: "2023-12-31"
    test_start: "2024-01-01"
    test_end: "2024-12-31"
  - train_end: "2024-12-31"
    test_start: "2025-01-01"
    test_end: "2025-12-31"
  - train_end: "2025-12-31"
    test_start: "2026-01-01"
    test_end: latest
