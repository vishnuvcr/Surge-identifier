capital: 100000
# Large sentinel means training starts at the first available historical session and expands
# forward to the session immediately before each OOS reporting window.
initial_training_sessions: 504
minimum_training_trades: 40
minimum_credit_points: 10.0
selection_slippage_per_leg_points: 0.50
stress_slippage_per_leg_points: [0.0, 0.25, 0.50, 1.0]
min_days_to_expiry: 1
max_days_to_expiry: 7
max_holding_sessions: 8
max_overlapping_positions: 1

# 256-config base grid. One configuration is frozen for each OOS walk-forward window.
short_distance_pct: [0.0125, 0.0150, 0.0175, 0.0200]
wing_width_points: [150, 200, 250, 300]
take_profit_credit_pct: [0.40, 0.50, 0.60, 0.70]
stop_loss_credit_multiple: [1.00, 1.25, 1.50, 2.00]

# Selection score components. All are calculated strictly inside the preceding training period.
score_median_weight: 2.0
score_mean_weight: 1.0
score_winrate_weight: 0.10
score_worst_trade_weight: 0.50
score_drawdown_weight: 0.50

# Daily decisions inside expanding walk-forward reporting windows.
walk_forward_reporting:
  - name: "2018"
    start: "2018-01-01"
    end: "2018-12-31"
  - name: "2019"
    start: "2019-01-01"
    end: "2019-12-31"
  - name: "2020"
    start: "2020-01-01"
    end: "2020-12-31"
  - name: "2021"
    start: "2021-01-01"
    end: "2021-12-31"
  - name: "2022"
    start: "2022-01-01"
    end: "2022-12-31"
  - name: "2023"
    start: "2023-01-01"
    end: "2023-12-31"
  - name: "2024"
    start: "2024-01-01"
    end: "2024-12-31"
  - name: "2025"
    start: "2025-01-01"
    end: "2025-12-31"
  - name: "2026-YTD"
    start: "2026-01-01"
    end: "latest"
