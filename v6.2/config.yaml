history_start: '2015-01-01'
history_end: '2026-09-16'
new_oos_start: '2026-04-01'
prediction_interval: 0.90
regime_threshold: 0.0025
rolling_training_years: 4
purge_days: 7
embargo_days: 2
seed: 42
sequence_length: 10
min_samples: 180

models:
  naive: true
  ridge: true
  rf: true
  extra_trees: true
  hgbr: true
  xgboost: true
  lstm: true
  ensemble: true

features:
  use_all_constituents: true
  use_point_in_time_weights: true
  use_fii_dii: true
  use_futures: true
  use_options_microstructure: true
  use_cross_asset: true
  use_news_sentiment: true
  use_technical_expansion: true

constituents:
  weights_url: 'https://huggingface.co/datasets/AMP4010/Historical_Nifty_50_Constituent_Weights_20Y/resolve/main/weights.csv?download=true'
  sectors_url: 'https://huggingface.co/datasets/AMP4010/Historical_Nifty_50_Constituent_Weights_20Y/resolve/main/sectors.csv?download=true'
  prices_repo: 'vishnun0027/indian-market-historical-ohlcv'
  weights_max_staleness_days: 180

flows:
  fallback_url: 'https://raw.githubusercontent.com/Hareeshkesavan/Stock-Market-Dataset/main/FII%20and%20DII.xlsx'

options:
  enabled: true
  max_risk_per_trade_fraction: 0.02
  entry_slippage_ticks: 2
  exit_slippage_ticks: 2
  wing_width_points: 250
  spread_width_points: 250
  otm_points: 250

costs:
  brokerage_per_order: 20.0
  exchange_txn_pct: 0.0003503
  sebi_turnover_pct: 0.000001
  gst_pct: 0.18
  stamp_buy_pct: 0.00003
  stt_sell_pct_pre_2026_04_01: 0.001
  stt_sell_pct_from_2026_04_01: 0.0015

pages: true
